<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter Outcry</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0E1030; --card:#161A40; --line2:#3A407A; --text:#F3EFE4; --soft:#C9CBE0; --muted:#9EA2C9;
  --voice:#2F3CFF; --voice-text:#8E95FF; --paper:#F3EFE4; --ink:#121426; --down:#C8323C;
  --display:'Big Shoulders Display','Oswald','Arial Narrow',sans-serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;min-height:100vh;min-height:100dvh;padding:24px 16px;
  background-image:radial-gradient(circle at 50% -20%,rgba(47,60,255,.35),transparent 60%)}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.mark{width:40px;height:40px;border-radius:12px;background:var(--voice);display:grid;place-items:center;color:#fff}
.word{font:900 30px/1 var(--display);letter-spacing:.01em}
.pass{position:relative;width:100%;background:var(--paper);color:var(--ink);border-radius:18px;padding:34px 26px 26px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.pass::before{content:"";position:absolute;top:12px;left:50%;width:46px;height:9px;margin-left:-23px;border-radius:99px;background:var(--bg);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
h1{margin:6px 0 6px;font:900 40px/0.95 var(--display);text-transform:uppercase}
.lede{margin:0 0 22px;color:#4a4740;font-size:15px}
label{display:block;font:600 13px var(--sans);margin-bottom:8px;color:#3a372f}
.field{display:flex;align-items:center;border:2px solid var(--ink);border-radius:12px;background:#fffdf7;overflow:hidden}
.field input{flex:1;min-width:0;border:0;background:transparent;padding:14px 14px;font:500 18px var(--mono);color:var(--ink);letter-spacing:.04em}
.field input:focus{outline:none}
.field:focus-within{box-shadow:0 0 0 4px rgba(47,60,255,.25)}
.show{border:0;background:transparent;color:#5a564b;font:600 13px var(--sans);padding:0 14px;cursor:pointer;align-self:stretch}
button.go{margin-top:14px;width:100%;border:0;border-radius:12px;background:var(--voice);color:#fff;font:700 17px var(--sans);padding:15px;cursor:pointer;transition:transform .12s,background .12s}
button.go:hover{background:#2531e0}
button.go:active{transform:translateY(1px)}
button.go[disabled]{opacity:.6;cursor:progress}
button:focus-visible,.brand:focus-visible,a:focus-visible{outline:3px solid var(--voice-text);outline-offset:3px}
.err{min-height:22px;margin:12px 0 0;color:var(--down);font-size:14px;font-weight:500}
.help{margin:18px 0 0;padding-top:16px;border-top:1px dashed #b9b2a2;color:#5a564b;font-size:14px}
.back{color:var(--muted);font-size:14px}
.back a{color:var(--soft)}
.pass.shake{animation:shake .4s}
.pass.open{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes stamp{50%{transform:scale(1.03) rotate(-1deg)}}
@media (prefers-reduced-motion:reduce){.pass.shake,.pass.open{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" href="index.html" aria-label="Outcry home">
    <span class="mark"><svg width="20" height="24" viewBox="0 0 40 48" fill="currentColor" aria-hidden="true"><rect x="7" y="6" width="6" height="24" rx="3"/><rect x="14" y="2" width="6" height="28" rx="3"/><rect x="21" y="3" width="6" height="27" rx="3"/><rect x="28" y="8" width="6" height="22" rx="3"/><rect x="7" y="20" width="27" height="24" rx="9"/><rect x="0" y="22" width="6" height="16" rx="3" transform="rotate(-28 3 30)"/></svg></span>
    <span class="word">OUTCRY</span>
  </a>
  <form class="pass" id="form" novalidate>
    <h1>The floor is invite-only</h1>
    <p class="lede">Enter the password you were given to get in.</p>
    <label for="pw">Access password</label>
    <div class="field">
      <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <button type="button" class="show" id="show" aria-controls="pw" aria-pressed="false">Show</button>
    </div>
    <button class="go" type="submit" id="go">Enter the floor</button>
    <p class="err" id="err" role="alert"></p>
    <p class="help">No password? Ask the person who invited you. You'll only need it once on each device.</p>
  </form>
  <p class="back">Just looking? <a href="index.html">See what Outcry is</a></p>
</main>
<script>
const $ = id => document.getElementById(id);
const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/terminal.html'; return n.startsWith('/') && !n.startsWith('//') ? n : '/terminal.html'; })();
$('pw').focus();
$('show').onclick = () => { const on = $('pw').type === 'password'; $('pw').type = on ? 'text' : 'password'; $('show').textContent = on ? 'Hide' : 'Show'; $('show').setAttribute('aria-pressed', String(on)); $('pw').focus(); };
$('form').onsubmit = async e => {
  e.preventDefault();
  const pw = $('pw').value.trim();
  const form = $('form');
  if (!pw) { $('err').textContent = 'Type the access password first.'; return; }
  $('go').disabled = true; $('go').textContent = 'Checking…'; $('err').textContent = '';
  try {
    const r = await fetch('/api/gate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: pw }), credentials: 'same-origin' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
    form.classList.add('open'); $('go').textContent = "You're in";
    setTimeout(() => { location.href = next; }, 350);
  } catch (err) {
    $('err').textContent = err.message;
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    $('go').disabled = false; $('go').textContent = 'Enter the floor';
    $('pw').select();
  }
};
</script>
</body>
</html>
