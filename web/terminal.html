<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outcry Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0E1030; --side:#0A0C26; --card:#161A40; --card2:#1C2150; --line:#262B57; --line2:#3A407A;
  --text:#F3EFE4; --soft:#C9CBE0; --muted:#9EA2C9; --voice:#2F3CFF; --voice-text:#8E95FF;
  --up:#3DDC97; --down:#FF6B6B; --paper:#F3EFE4; --ink:#121426; --dash:#B9B2A2;
  --memes:#F76FB0; --stocks:#8E2C48; --swaps:#2FA6E8; --launch:#B5D93A; --strategies:#8B6CF6; --research:#C9A46C;
  --display:'Big Shoulders Display','Oswald','Arial Narrow',sans-serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--voice-text);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.eyebrow{font:11px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:260px minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr);overflow:hidden}

.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--voice);color:#F3EFE4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.word{font:900 28px/1 var(--display)}
.member{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px}
.mbadge{min-width:42px;height:52px;padding:0 6px;border-radius:8px;background:var(--memes);color:var(--ink);border:1.5px solid var(--paper);display:flex;align-items:center;justify-content:center;font:900 19px var(--display)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{background:var(--card2)}
.btn-primary{background:var(--voice);border-color:var(--voice);color:#F3EFE4;font-weight:600}
.btn-primary:hover{background:#4450FF}
.btn-danger{border-color:#7A2F3A;color:#FFB3B3}
.btn[disabled]{opacity:.5;cursor:default}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:14px}
.sq{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}
.status{font:10.5px var(--mono);letter-spacing:.08em}
.rank{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line,rgba(127,127,127,.25));border-radius:12px;padding:12px}
.rank-head{display:flex;flex-direction:column;gap:2px}
.rank-scroll{overflow-x:auto}
.rank table{width:100%;border-collapse:collapse;font-size:13px}
.rank th{font:10px var(--mono);letter-spacing:.08em;color:var(--muted);text-align:left;padding:4px 6px;white-space:nowrap}
.rank td{padding:6px;border-top:1px solid rgba(127,127,127,.15);white-space:nowrap}
.rank .v{font:11px var(--mono);padding:2px 6px;border-radius:5px}
.rank .v.ok{color:var(--up);background:rgba(61,220,151,.12)} .rank .v.mid{color:#f5b642;background:rgba(245,182,66,.12)} .rank .v.no{color:var(--muted);background:rgba(127,127,127,.12)}
.pend{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;font-size:13px}
.pend:hover{background:var(--card2)}
.pend b{font:600 12px var(--mono)}
#pending{display:flex;flex-direction:column;gap:6px}
.sheet{position:fixed;inset:0;z-index:45;background:rgba(6,7,24,.85);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.sheet-body{width:min(920px,100%);background:var(--bg);border:1px solid var(--line2);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{margin:0;font:900 34px var(--display);letter-spacing:.02em}
.lst{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 200px;gap:10px 16px;background:var(--card)}
.lst h3{margin:0;font:800 26px var(--display);letter-spacing:.02em}
.lst .ret{font:800 30px var(--display);text-align:right}
.lst .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font:12px var(--mono);color:var(--soft)}
.lst .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lst svg{width:200px;height:56px}
.rank{display:inline-block;margin-right:10px;padding:2px 8px;border-radius:8px;border:1px solid var(--line2);font:700 15px var(--mono);vertical-align:middle;color:var(--soft)}
.rank.top{background:var(--voice);border-color:var(--voice);color:#fff}
.rank.new{font-size:11px;letter-spacing:.08em}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tabs .chip{border:1px solid var(--line2);background:transparent;color:inherit;border-radius:999px;padding:7px 14px;font:13px var(--mono);cursor:pointer}
.tabs .chip.on{background:var(--voice);border-color:var(--voice);color:#fff}
.lw{max-width:620px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.lw-pills{display:flex;flex-wrap:wrap;gap:6px}
.lw-pill{font:11px var(--mono);letter-spacing:.06em;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;color:var(--soft)}
.lw-pill.red{border-color:#ff5a5a;color:#ffb3b3}
.lw-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.lw-row{display:flex;justify-content:space-between;align-items:center}
.lw-icon{background:transparent;border:1px solid var(--line2);color:inherit;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:16px}
.lw-total{font:900 52px/1 var(--display)}
.lw-addr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.lw-addr code{font:13px var(--mono);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
.btn-sm{padding:6px 12px;font-size:13px}
.lw-hint{margin:0}
.lw-custody{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.lw-custody.ok{border-color:rgba(61,220,151,.5)}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.hot{border-color:#ff5a5a;box-shadow:0 0 0 1px rgba(255,90,90,.25)}
.plan.cur{border-color:var(--voice-text)}
.plan-price{font:900 40px var(--display)}.plan-price span{font:14px var(--mono);color:var(--muted);margin-left:4px}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;flex:1}
.plans-top{display:flex;flex-direction:column;gap:10px}.plans-seg{max-width:420px}
@media (max-width:760px){.plans{grid-template-columns:1fr}}
.tier-bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line2);overflow:hidden}.tier-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--voice),#3DDC97)}
.lw-reclaim{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.lw-warn{margin:0;color:#ffb36b}
.lw-list{display:flex;flex-direction:column}
.lw-list>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.lw-list>div:last-child{border-bottom:0}
.lw-list>div>span:last-child{text-align:right}
.lw-list a{color:var(--voice-text)}
.lw-form{display:flex;flex-direction:column;gap:14px}
.lw-form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft)}
.lw-form select{background:var(--bg);border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:11px 12px;font:14px var(--mono)}
.lw-form input{background:var(--bg);border:1px solid var(--line2);border-radius:10px;color:var(--text);padding:11px 12px;font:14px var(--mono);min-width:0}
.lw-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:4px}
.lw-seg button{background:transparent;border:0;color:var(--soft);padding:9px;border-radius:9px;font:600 14px inherit;cursor:pointer}
.lw-seg button.on{background:var(--voice);color:#fff}
.lw-seg button[data-side=sell].on{background:#e2475a}
.lw-lbl{display:block;font-size:13px;color:var(--soft);margin-bottom:6px}
.lw-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lw-chips .chip{border:1px solid var(--line2);background:transparent;color:inherit;border-radius:999px;padding:8px 14px;font:13px var(--mono);cursor:pointer}
.lw-chips .chip.on{background:var(--card2);border-color:var(--voice-text)}
.lw-chips input{width:90px;flex:1}
.lw-go{width:100%;padding:13px}
.lw-qbody{display:flex;justify-content:space-between;gap:12px;padding:14px;flex-wrap:wrap}
#liveBtn{border-color:#ff5a5a;color:#ffb3b3}
.live-tk{display:flex;flex-direction:column;gap:10px;max-width:560px}
.live-acts{display:flex;gap:8px;flex-wrap:wrap}
.live-res a{color:var(--voice-text)}
.live-cost{margin-top:4px;font:11px var(--mono);color:var(--muted)}
.fill-fx{position:fixed;inset:0;z-index:80;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:rgba(6,7,24,.72);animation:fxIn .18s ease-out}
.fill-fx.out{opacity:0;transition:opacity .3s}
.fx-flash{position:absolute;inset:0;animation:fxFlash .6s ease-out forwards}
.is-buy .fx-flash{background:radial-gradient(circle at 50% 55%,rgba(61,220,151,.55),transparent 60%)}
.is-sell .fx-flash{background:radial-gradient(circle at 50% 55%,rgba(255,90,90,.55),transparent 60%)}
.fx-slip{position:absolute;top:-60px;left:var(--x);padding:4px 10px;background:var(--paper);color:var(--ink);font:700 calc(14px*var(--s)) var(--mono);letter-spacing:.08em;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:fxFall var(--t) cubic-bezier(.3,.1,.5,1) var(--d) forwards;transform:rotate(var(--r))}
.is-buy .fx-slip:nth-child(3n){background:#3DDC97}.is-sell .fx-slip:nth-child(3n){background:#ff8a8a}
.fx-card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:24px}
.fx-hand{color:var(--voice-text);animation:fxHand .5s cubic-bezier(.2,1.6,.4,1) both}
.fx-stamp{font:900 clamp(72px,16vw,168px)/.9 var(--display);letter-spacing:.02em;padding:6px 26px;border:8px solid currentColor;border-radius:14px;transform:rotate(-6deg);animation:fxStamp .42s cubic-bezier(.2,1.8,.35,1) .22s both;text-shadow:0 0 40px currentColor}
.is-buy .fx-stamp{color:#3DDC97}.is-sell .fx-stamp{color:#ff6b6b}
.fx-what{margin-top:14px;font:800 clamp(26px,5vw,40px) var(--display);animation:fxUp .4s ease-out .5s both}
.fx-sub{font:13px var(--mono);color:var(--soft);animation:fxUp .4s ease-out .62s both}
.fx-tap{margin-top:10px;font:11px var(--mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;animation:fxUp .4s ease-out 1s both}
@keyframes fxIn{from{opacity:0}}
@keyframes fxFlash{0%{opacity:0}25%{opacity:1}100%{opacity:.25}}
@keyframes fxFall{to{transform:translateY(calc(100vh + 120px)) rotate(calc(var(--r) * -2))}}
@keyframes fxHand{0%{transform:translateY(-40px) scale(.6) rotate(-20deg);opacity:0}70%{transform:translateY(6px) scale(1.15) rotate(8deg);opacity:1}100%{transform:none}}
@keyframes fxStamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
@keyframes fxUp{from{transform:translateY(12px);opacity:0}}
@media (prefers-reduced-motion: reduce){.fill-fx *{animation:none!important}}
@media (max-width:640px){.lw-total{font-size:42px}.lw-card{padding:14px}}
.creator-head{display:flex;gap:16px;align-items:center}
.cbadge{width:64px;height:64px;flex:none;border-radius:14px;display:grid;place-items:center;background:#ff5fa2;color:#1a0f2a;font:900 22px var(--display)}
.cstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cstat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:2px}
.cstat b{font:800 26px var(--display)}
.cstat span{font:12px var(--mono);color:var(--soft)}
@media (max-width:640px){.lst{grid-template-columns:1fr}.lst .ret{text-align:left}.lst svg{width:100%}}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft)}
.form input,.form textarea{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;color:var(--text)}
.form .wide{grid-column:1/-1}
@media (max-width:700px){.lst{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
.recap-btn{padding:6px 12px;font-size:13px}
.recap-modal{position:fixed;inset:0;z-index:50;background:rgba(6,7,24,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.recap-modal canvas{max-height:calc(100dvh - 120px);max-width:100%;aspect-ratio:4/5;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.recap-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.recap-bar .btn{padding:8px 14px;font-size:14px}
.perf{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line,rgba(127,127,127,.25));border-radius:12px;padding:12px}
.perf-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.perf-eq{font:600 26px var(--mono)}
.perf-pnl{font:600 14px var(--mono)}
.perf-chart{position:relative;height:170px}
.perf-chart svg{display:block;width:100%;height:100%}
.perf-tip{position:absolute;pointer-events:none;font:11px var(--mono);background:rgba(10,12,40,.92);color:#fff;padding:4px 7px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);display:none}
.perf-pills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.perf-pills div{display:flex;flex-direction:column;gap:2px}
.perf-pills b{font:600 13px var(--mono)} .perf-pills span{font:10px var(--mono);letter-spacing:.08em;color:var(--muted)}
.dd-bar{height:6px;border-radius:3px;background:rgba(127,127,127,.2);overflow:hidden}.dd-bar i{display:block;height:100%}
.perf-pos{display:flex;flex-direction:column;gap:4px;font:12px var(--mono)}
.perf-pos div{display:flex;justify-content:space-between}
.ap-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 0;cursor:pointer}
.ap-row svg{grid-column:1/-1;width:100%;height:34px;display:block}
.ap-name{font-size:13px;font-weight:500} .ap-val{font:12px var(--mono);text-align:right}
.up{color:var(--up)} .down{color:var(--down)}
@media (max-width:700px){.perf-pills{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chat-row{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--soft)}
.chat-row:hover{background:var(--card2);color:var(--text)}
.chat-row.on{background:var(--card2);color:var(--text);box-shadow:inset 2px 0 0 var(--voice)}
.chat-row .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-row .cw{font:10.5px var(--mono);color:var(--muted);flex-shrink:0}
.chat-row .cx{opacity:0;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.chat-row:hover .cx,.chat-row.on .cx{opacity:1}
.chat-row .cx:hover{color:var(--down)}
#chats{max-height:32vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.menu-btn{display:none;border:1px solid var(--line2);background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
@media (max-width:820px){.menu-btn{display:inline-block}.side.open{display:flex;position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);z-index:30;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}}
.acct{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.acct-st{font-size:11px;color:var(--muted)} .acct-st.ok{color:var(--up)}
.linkbtn{background:none;border:0;padding:0;color:var(--voice-text);font-size:12.5px;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.agent-row{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:8px}
.agent-row .item{padding:0}
.a-ctl{display:flex;gap:6px;flex-wrap:wrap}
.a-ctl button{font:11px var(--mono);letter-spacing:.04em;padding:4px 8px;border-radius:6px;border:1px solid var(--line,rgba(127,127,127,.3));background:transparent;color:inherit;cursor:pointer}
.a-ctl button:hover{border-color:currentColor}
.a-ctl button.del{color:var(--down)}
.st-live{color:var(--up)} .st-paper{color:var(--voice-text)} .st-paused{color:var(--muted)} .st-backtested{color:var(--soft)}
.empty{font-size:13px;color:var(--muted);padding:4px 10px}
.tiers{display:flex;flex-direction:column;gap:4px;font:11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px}
.tiers b{color:var(--soft);font-weight:500}

.chat{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.chat-head{min-height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;flex-wrap:wrap}
.chat-head h1{margin:0;font:800 24px/1 var(--display);text-transform:uppercase}
.pill{font:10.5px var(--mono);letter-spacing:.08em;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;color:var(--muted)}
.log{flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
@media (max-width:820px){.log{padding:16px}.chat-head{padding:10px 16px}}
.msg-user{align-self:flex-end;max-width:min(78%,640px);background:var(--voice);color:#F3EFE4;border-radius:14px 14px 3px 14px;padding:12px 15px;white-space:pre-wrap}
.msg-ai{display:flex;gap:12px;max-width:min(100%,780px)}
.ai-mark{width:28px;height:28px;border-radius:8px;background:var(--card2);color:var(--voice-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.ai-body{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}
.ai-body > p{margin:0;color:var(--soft);white-space:pre-wrap}
.meta{font:10.5px var(--mono);color:var(--muted);letter-spacing:.04em}
.thinking{display:flex;gap:5px;padding:10px 0}
.thinking span{width:7px;height:7px;border-radius:99px;background:var(--voice-text);animation:blink 1s infinite}
.thinking span:nth-child(2){animation-delay:.15s}.thinking span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

.ticket{background:var(--paper);color:var(--ink);border-radius:10px;overflow:hidden;font:13px var(--mono);position:relative}
.t-head{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--ink)}
.t-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px dashed var(--dash)}
.t-row:last-child{border-bottom:0}
.t-row small{display:block;color:#5E6072;font-size:11.5px}
.t-muted{color:#5E6072}
.t-warn{background:#FCE7D7;color:#7A2E0E;padding:9px 14px;font:12.5px/1.45 var(--sans);border-bottom:1px dashed var(--dash)}
.t-reject{background:#FAD4D4;color:#7A1414;padding:10px 14px;font:13px/1.45 var(--sans)}
.t-note{padding:8px 14px;font:12px/1.45 var(--sans);color:#3A3C4E;border-bottom:1px dashed var(--dash)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--ink);background:#FBF8F1;color:var(--ink);cursor:pointer;font-weight:700}
.stepper output{min-width:64px;text-align:center;font-weight:700}
.wallets{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;padding:12px 14px;border-bottom:1px dashed var(--dash)}
.wal{border:1.5px solid var(--ink);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;background:#FBF8F1;transition:background .25s}
.wal small{font-size:10px;color:#5E6072}
.wal.done{background:var(--launch)}
.disclose{display:flex;gap:10px;padding:12px 14px;background:#E7E2D5;font:12.5px/1.5 var(--sans);color:var(--ink);align-items:flex-start}
.disclose input{margin-top:3px;width:16px;height:16px;accent-color:var(--voice)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stamp{position:absolute;right:18px;top:38%;border:4px solid var(--voice);color:var(--voice);border-radius:8px;padding:4px 14px;font:900 44px/1 var(--display);background:rgba(243,239,228,.9);transform:rotate(-10deg);animation:stamp .38s cubic-bezier(.2,.8,.3,1) both;pointer-events:none}
.stamp.bad{border-color:#B3261E;color:#B3261E;font-size:34px}
@keyframes stamp{0%{transform:rotate(-10deg) scale(1.8);opacity:0}60%{transform:rotate(-10deg) scale(.94);opacity:1}100%{transform:rotate(-10deg) scale(1)}}
.steps{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:12.5px var(--mono)}
.step{display:flex;gap:10px;align-items:center;color:var(--muted)}
.step.on{color:var(--text)}
.step .ck{width:16px;height:16px;border-radius:99px;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.step.done .ck{background:var(--up);border-color:var(--up);color:var(--ink)}
.jtag{font:700 10.5px var(--mono);letter-spacing:.08em;padding:3px 7px;border-radius:4px;color:var(--ink)}

.builder{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.b-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.b-head strong{font:900 24px/1 var(--display);text-transform:uppercase}
.b-progress{font:11px var(--mono);color:var(--voice-text);letter-spacing:.08em}
.blueprint{position:relative;padding:18px 16px 8px 52px;display:flex;flex-direction:column;gap:14px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.spine{position:absolute;left:31px;top:30px;width:2px;background:var(--voice);height:0;transition:height .5s ease}
.node{position:relative;background:var(--side);border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;opacity:0;transform:translateX(-8px);transition:opacity .35s,transform .35s,border-color .3s}
.node.on{opacity:1;transform:none}
.node::before{content:"";position:absolute;left:-27px;top:14px;width:12px;height:12px;border-radius:99px;background:var(--bg);border:2px solid var(--voice)}
.node.on::before{background:var(--voice)}
.node .lbl{font:10.5px var(--mono);letter-spacing:.1em;color:var(--voice-text)}
.node .val{margin-top:3px;font-size:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.node .val span.line{display:block;width:100%}
.node.flash{border-color:var(--launch)}
.hand{display:inline-block;animation:wave 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.adjust{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
@media (max-width:640px){.adjust{grid-template-columns:1fr}}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--soft)}
.ctl-top output{font:700 13px var(--mono);color:var(--text)}
input[type=range]{width:100%;accent-color:var(--voice)}
.wide{grid-column:1/-1}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;background:transparent;font-size:13px}
.tg[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.summary{background:var(--side);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--soft)}
.summary b{color:var(--text)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--soft)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:640px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.metric{background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.metric b{font:700 18px var(--mono);font-variant-numeric:tabular-nums}
.metric span{font:10.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.curve{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.curve svg{width:100%;height:120px;display:block}
.warns{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#FFC98A}

.composer{border-top:1px solid var(--line);padding:12px 24px 18px;display:flex;flex-direction:column;gap:10px}
@media (max-width:820px){.composer{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}}
.sugs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sug{flex-shrink:0;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:8px 13px 8px 10px;cursor:pointer;font-size:13px;color:var(--soft);display:flex;gap:7px;align-items:center;white-space:nowrap}
.sug:hover{background:var(--card2);color:var(--text)}
.input-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:14px;background:var(--card);padding:6px 6px 6px 16px}
.input-row:focus-within{border-color:var(--voice-text)}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:15px;min-height:42px}
.send{width:44px;height:44px;border:0;border-radius:10px;background:var(--voice);color:#F3EFE4;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

.panel{background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.p-sec{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.big{font:900 50px/.95 var(--display);font-variant-numeric:tabular-nums}
.pos{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1C2150;gap:10px}
.pos:last-child{border-bottom:0}
.pos-l{display:flex;gap:10px;align-items:center;min-width:0}
.pos-l i{width:5px;height:30px;border-radius:3px;flex-shrink:0;background:var(--paper)}
.pos-r{font:12.5px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:8px;font:12px/1.45 var(--mono)}
.ev{display:flex;gap:8px;color:var(--soft);animation:rise .3s ease both}
.ev time{color:var(--muted);flex-shrink:0}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:14px;z-index:10}
@media (max-width:1180px){.app{grid-template-columns:240px minmax(0,1fr)}.panel{display:none}}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.chat-head h1{font-size:20px}}
@media (prefers-reduced-motion: reduce){.hand,.thinking span{animation:none}.node,.spine{transition:none}.stamp,.ev{animation:none}}

    <a class="brand" href="index.html" style="color:inherit;text-decoration:none" aria-label="Outcry home">
      <span class="mark"><svg width="18" height="22" viewBox="0 0 40 48" fill="currentColor" aria-hidden="true"><rect x="7" y="6" width="6" height="24" rx="3"/><rect x="14" y="2" width="6" height="28" rx="3"/><rect x="21" y="3" width="6" height="27" rx="3"/><rect x="28" y="8" width="6" height="22" rx="3"/><rect x="7" y="20" width="27" height="24" rx="9"/><rect x="0" y="22" width="6" height="16" rx="3" transform="rotate(-28 3 30)"/></svg></span>

    <div class="member"><span class="mbadge" id="badge">…</span><div><div style="font-weight:600;font-size:14px">Floor member</div><div class="mono" style="font-size:11px;color:var(--muted)" id="memberSub">connecting…</div></div></div>

<script src="outcry-local.js"></script>
<script>
const J = { memes:['Memes','#F76FB0','#121426'], stocks:['Stocks','#8E2C48','#F3EFE4'], swaps:['Swaps','#2FA6E8','#121426'], launch:['Launch','#B5D93A','#121426'], strategies:['Strategies','#8B6CF6','#121426'], research:['Research','#C9A46C','#121426'] };
const HAND = '<svg width="14" height="17" viewBox="0 0 40 48" fill="currentColor" aria-hidden="true"><rect x="7" y="6" width="6" height="24" rx="3"/><rect x="14" y="2" width="6" height="28" rx="3"/><rect x="21" y="3" width="6" height="27" rx="3"/><rect x="28" y="8" width="6" height="22" rx="3"/><rect x="7" y="20" width="27" height="24" rx="9"/><rect x="0" y="22" width="6" height="16" rx="3" transform="rotate(-28 3 30)"/></svg>';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 2) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const amt = n => Math.abs(n) >= 1000 ? fmt(n, 2) : Math.abs(n) >= 1 ? fmt(n, 4) : Number(n).toPrecision(4);
const jtag = k => { const j = J[k] || J.swaps; return `<span class="jtag" style="background:${j[1]};color:${j[2]}">${j[0].toUpperCase()}</span>`; };
// v0: the client sends a placeholder assertion. Production: navigator.credentials.get() over the ticket hash.
const passkey = () => 'demo-passkey-' + Date.now();
let secured = false;
const TOKEN_KEY = 'outcry.token';
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
let wa = null;
async function webauthn() { wa ??= await import('./webauthn.js'); return wa; }
/** Body fields that prove approval: a real passkey on secured accounts, a tap otherwise. */
async function approval(ticketId) {
  if (!secured) return { passkeyAssertion: passkey() };
  const opts = await api(`/api/tickets/${ticketId}/challenge`, { method: 'POST' });
  const { startAuthentication } = await webauthn();
  return { passkeyResponse: await startAuthentication({ optionsJSON: opts }) };
}
function drawAccount(st) {
  if (mode !== 'server') return;
  $('acct').hidden = false;
  secured = !!st?.secured;
  $('acctState').textContent = secured ? '✓ Secured with a passkey · trades need Face ID / Touch ID' : 'Guest · saved in this browser only';
  $('acctState').className = 'mono acct-st' + (secured ? ' ok' : '');
  $('secureBtn').hidden = secured; $('signInBtn').hidden = secured; $('signOutBtn').hidden = !secured;
}
async function loadAccount() {
  try { drawAccount(await api('/api/auth/status')); } catch { /* ignore */ }
  try { const me = await api('/api/me'); myHandle = me.user.handle || null; $('adminBtn').hidden = !me.isAdmin; tgState = me.telegram; $('tgBtn').textContent = me.telegram?.linked ? '🔔 Telegram alerts · on' : '🔔 Telegram alerts'; $('handleBtn').textContent = myHandle ? `@${myHandle} · change` : 'Choose your @handle'; } catch {}
}
let myHandle = null;
async function chooseHandle() {
  const h = prompt('Your public @handle (3-16 letters, digits or _). It appears on agents you publish.', myHandle || '');
  if (!h) return false;
  try { const r = await api('/api/me', { method: 'PATCH', body: { handle: h } }); myHandle = r.user.handle; $('handleBtn').textContent = `@${myHandle} · change`; toast(`You're @${myHandle}`); return true; }
  catch (e) { toast(e.message); return false; }
}

const shown = new Set();
let token = null, sessionId = 'main-' + Date.now().toString(36), busy = false;
const log = $('log');

// Two backends, same routes: the Node server (npm start) or the in-browser
// engine (outcry-local.js) used for the hosted demo link.
let mode = 'local';
async function detectMode() {
  try {
    const r = await fetch('/api/health', { headers: { accept: 'application/json' } });
    const j = await r.json();
    if (r.ok && j.ok) { mode = 'server'; return; }
  } catch (e) { /* no server */ }
  mode = window.OutcryLocal ? 'local' : 'none';
}
async function api(path, opts = {}) {
  const method = opts.method || 'GET';
  if (mode === 'local') {
    const r = await window.OutcryLocal.request(method, path, token || undefined, opts.body);
    if (r.status >= 400) throw new Error(r.json?.error || 'Request failed');
    return r.json;
  }
  const hasBody = opts.body !== undefined;
  const res = await fetch(path, { method, headers: { ...(hasBody ? { 'content-type': 'application/json' } : {}), ...(token ? { authorization: 'Bearer ' + token } : {}) }, body: hasBody ? JSON.stringify(opts.body) : undefined });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.statusText);
  return j;
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
const scrollDown = () => { log.scrollTop = log.scrollHeight; };

function addUser(text) { const d = document.createElement('div'); d.className = 'msg-user'; d.textContent = text; log.appendChild(d); scrollDown(); }
function addAI(html) {
  const w = document.createElement('div'); w.className = 'msg-ai';
  w.innerHTML = `<span class="ai-mark">${HAND}</span><div class="ai-body">${html}</div>`;
  log.appendChild(w); scrollDown(); return w.querySelector('.ai-body');
}
function feed(text) {
  const f = $('feed'); const t = new Date();
  const e = document.createElement('div'); e.className = 'ev';
  e.innerHTML = `<time>${t.toTimeString().slice(0, 8)}</time><span>${esc(text)}</span>`;
  f.prepend(e); while (f.children.length > 30) f.lastChild.remove();
}

// ---------------- portfolio & agents ----------------
async function loadPending() {
  try {
    const list = (await api('/api/tickets')).filter(t => t.status === 'needs_confirmation' || t.status === 'needs_second_confirmation');
    $('pendingSec').hidden = !list.length;
    $('pending').innerHTML = list.slice(-6).reverse().map(t => {
      const what = t.kind === 'launch' ? `LAUNCH $${esc(t.request.ticker)} · ${fmt(t.totalSol || 0)} SOL` : t.legs.map(l => `${l.side.toUpperCase()} ${esc(l.asset)}`).join(' + ') + ` · $${fmt(t.totalUsd)}`;
      return `<div class="pend" data-id="${t.id}"><b>${what}</b><span class="meta">${t.source?.type === 'agent' ? 'agent' : 'open →'}</span></div>`;
    }).join('');
  } catch { /* ignore */ }
}
async function refresh() {
  loadPending();
  try {
    const me = await api('/api/me');
    const p = me.portfolio;
    $('walletUsd').textContent = '$' + fmt(p.walletUsd);
    $('balances').textContent = Object.entries(p.balances).filter(([, v]) => v > 1e-9).map(([k, v]) => `${k} ${amt(v)}`).join(' · ');
    $('positions').innerHTML = p.positions.length ? p.positions.map(x => `<div class="pos"><div class="pos-l"><i style="background:${(J[x.jacket] || J.swaps)[1]}"></i><div style="min-width:0"><div style="font-weight:500">${esc(x.symbol)}</div><div class="mono" style="font-size:11px;color:var(--muted)">${esc((J[x.jacket] || J.swaps)[0])}${x.note ? ' · ' + esc(x.note) : ''}</div></div></div><div class="pos-r"><div>$${fmt(x.valueUsd)}</div><div style="color:${x.pnlUsd >= 0 ? 'var(--up)' : 'var(--down)'}">${x.pnlUsd >= 0 ? '+' : ''}${fmt(x.pnlUsd)}</div></div></div>`).join('') : '<div class="empty" style="padding:0">No positions yet.</div>';
    $('spend').textContent = `$${me.usage.usd.toFixed(4)} · ${me.usage.turns} model call${me.usage.turns === 1 ? '' : 's'}`;
  } catch (e) { /* ignore transient */ }
  try {
    const list = await api('/api/agents');
    const rows = list.filter(x => x.agent.state !== 'killed');
    $('agents').innerHTML = rows.map((x) => { const a = x.agent;
      const running = a.state === 'live' || a.state === 'paper';
      const btns = [
        running ? `<button type="button" data-act="pause" data-id="${a.id}">Pause</button>` : '',
        a.state === 'paused' ? `<button type="button" data-act="resume" data-id="${a.id}">Resume</button>` : '',
        running || a.state === 'paused' ? `<button type="button" data-act="kill" data-id="${a.id}" title="Stop for good; unspent funds return to your main wallet">Kill</button>` : '',
        `<button type="button" data-act="rename" data-id="${a.id}" data-name="${esc(a.spec.name)}">Rename</button>`,

function searchCard(c) {

async function renderCards(body, cards, instant = false) {
  for (const c of cards) {
    if (c.type === 'order') body.appendChild(orderCard(c.ticket));
    else if (c.type === 'live_order') body.appendChild(liveTicket(c.quote));
    else if (c.type === 'live_withdraw') body.appendChild(withdrawTicket(c.withdrawal));
    else if (c.type === 'launch') body.appendChild(launchCard(c.ticket, c.devSharePct));
    else if (c.type === 'agent') body.appendChild(await agentCard(c, instant));
    else if (c.type === 'strategy') body.appendChild(strategyCard(c));
    else if (c.type === 'strategy_search') body.appendChild(searchCard(c));
  }
}

async function agentAction(id, act, name) {

    catch (err) { toast(err.message); }
    refresh(); return;
  }
  if (act === 'update') {

    await api(`/api/agents/${id}/update-strategy`, { method: 'POST' });
    feed(`${name} updated to the creator's latest version`); refresh(); return;

  if (act === 'rename') {

    const r = await api(`/api/agents/${id}`, { method: 'PATCH', body: { name: n.trim() } });

    document.querySelectorAll('.builder .aname').forEach(el => { if (el.textContent === name) el.textContent = r.agent.spec.name; });
    refresh(); pollAgents();

  }
  if (act === 'delete') {

function drawPerfChart(box, perf) {

    wdf.onsubmit = async ev => {
      ev.preventDefault();
      wdrev.innerHTML = '<p class="meta">Preparing…</p>';
      let w;
      try { w = await api('/api/live/withdraw', { method: 'POST', body: { to: wdf.to.value.trim(), token: wdf.token.value, ...(wdMax ? { max: true } : { amount: +wdf.amount.value }) } }); }
      catch (e) { wdrev.innerHTML = `<p class="meta down">${esc(e.message)}</p>`; return; }
      wdrev.innerHTML = '';
      wdrev.appendChild(withdrawTicket(w, { solUsdPerSol: (p?.solUsd && p?.sol) ? p.solUsd / p.sol : 0, onDone: () => setTimeout(render, 3000), onCancel: () => { wdrev.innerHTML = ''; } }));
    };
    const form = body.querySelector('.lw-trade');
    let side = 'buy';
    const setSide = v => { side = v; form.querySelectorAll('[data-side]').forEach(b => b.classList.toggle('on', b.dataset.side === v)); form.querySelector('.lw-buy').hidden = v !== 'buy'; form.querySelector('.lw-sell').hidden = v !== 'sell'; form.querySelector('.lw-go').textContent = v === 'buy' ? 'Get real quote' : 'Get sell quote'; };
    form.addEventListener('click', e => {
      const b = e.target.closest('[data-side]'); if (b) setSide(b.dataset.side);
      const c = e.target.closest('[data-usd],[data-pct]');
      if (c) { const k = c.dataset.usd ? 'usd' : 'pct'; form[k].value = c.dataset[k]; c.parentElement.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); }
    });
    form.addEventListener('input', e => { if (e.target.name === 'usd' || e.target.name === 'pct') e.target.parentElement.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); });
    body.querySelectorAll('[data-sellmint]').forEach(b => b.onclick = () => { setSide('sell'); form.token.value = b.dataset.sellmint; form.scrollIntoView({ behavior: 'smooth' }); });
    form.onsubmit = async ev => {
      ev.preventDefault();
      const f = new FormData(form);
      const host = body.querySelector('.lw-quote');
      host.innerHTML = '<p class="meta">Asking Jupiter for a real price…</p>';
      try {
        quote = await api('/api/live/quote', { method: 'POST', body: side === 'buy' ? { side, token: String(f.get('token')).trim(), usd: +f.get('usd') } : { side, token: String(f.get('token')).trim(), pct: +f.get('pct') } });
      } catch (e) { host.innerHTML = `<p class="meta down">${esc(e.message)}</p>`; return; }
      host.innerHTML = '';
      host.appendChild(liveTicket(quote, { onDone: () => setTimeout(render, 2500), onCancel: () => { host.innerHTML = ''; } }));
    };
  };
  body.addEventListener('click', async e => {
    const t = e.target;
    if (t.closest('[data-secure]')) { close(); $('secureBtn')?.click(); return; }
    if (t.closest('[data-handle]')) { if (await chooseHandle()) render(); return; }
    if (t.closest('[data-reload]')) { render(); return; }
    if (t.closest('[data-copy]')) { const a = body.querySelector('.lw-addr code').title; try { await navigator.clipboard.writeText(a); toast('Address copied'); } catch { prompt('Your wallet address', a); } return; }
    if (t.closest('[data-create]')) {
      t.disabled = true; t.textContent = 'Creating on Turnkey…';
      try { const w = await api('/api/live/wallet', { method: 'POST' }); toast('Real wallet created: ' + w.address.slice(0, 6) + '…'); render(); } catch (err) { toast(err.message); t.disabled = false; t.textContent = 'Create my real wallet'; }
      return;
    }
  });
  const obs = new MutationObserver(() => { if (!document.body.contains(body)) { stop(); obs.disconnect(); } });
  obs.observe(document.body, { childList: true });
  await render();
}
async function openAdmin() {
  const { body } = sheet('Live access requests');
  const load = async () => {
    let list;
    try { list = await api('/api/admin/access'); } catch (e) { body.innerHTML = `<p class="meta">${esc(e.message)}</p>`; return; }
    body.innerHTML = list.length ? `<div class="lw"><div class="lw-card"><div class="lw-list">${list.map(r => `<div><span><b>@${esc(r.handle || '?')}</b> ${r.secured ? '<span class="lw-pill">passkey ✓</span>' : '<span class="lw-pill red">no passkey</span>'}<br><span class="meta">${new Date(r.at).toLocaleString()}${r.note ? ' · ' + esc(r.note) : ''}</span></span><span><button class="btn btn-sm" type="button" data-ok="${r.userId}">Approve</button> <button class="btn btn-sm" type="button" data-no="${r.userId}">Deny</button></span></div>`).join('')}</div></div></div>` : '<p class="meta">No pending requests.</p>';
  };
  body.addEventListener('click', async e => {
    const b = e.target.closest('[data-ok],[data-no]'); if (!b) return;
    try { await api(`/api/admin/access/${b.dataset.ok || b.dataset.no}`, { method: 'POST', body: { approve: !!b.dataset.ok } }); toast(b.dataset.ok ? 'Approved' : 'Denied'); load(); } catch (err) { toast(err.message); }
  });
  load();
}
async function openPlans() {
  const { body, close } = sheet('Plans');
  let d;
  try { d = await api('/api/plans'); } catch (e) { body.innerHTML = `<p class="meta">${esc(e.message)}</p>`; return; }
  let months = 1;
  const draw = () => {
    body.innerHTML = `<div class="plans-top"><p class="meta" style="margin:0">Paper trading stays free. Plans lower your fee on real trades and unlock more real-money agents. Paid in USDC from your real wallet, signed with your passkey.${d.until ? ` Your plan runs until ${new Date(d.until).toLocaleDateString()}.` : ''}</p>
      <div class="lw-seg plans-seg"><button type="button" data-m="1" class="${months === 1 ? 'on' : ''}">Monthly</button><button type="button" data-m="12" class="${months === 12 ? 'on' : ''}">Yearly · 2 months free</button></div></div>
      <div class="plans">${d.plans.map(p => `<div class="plan ${p.id === d.current ? 'cur' : ''} ${p.id === 'sniper' ? 'hot' : ''}">
        <span class="eyebrow">${esc(p.name)}</span>
        <div class="plan-price">${p.priceUsd ? `$${months === 12 ? p.priceUsd * 10 : p.priceUsd}<span>/${months === 12 ? 'year' : 'month'}</span>` : 'Free'}</div>
        <ul>${p.perks.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        ${p.id === d.current ? '<span class="lw-pill">Your plan</span>' : p.priceUsd ? `<button class="btn btn-primary" type="button" data-sub="${p.id}" ${d.payable ? '' : 'disabled title="Payments not set up yet"'}>Get ${esc(p.name)}</button>` : ''}
      </div>`).join('')}</div><div class="plan-pay"></div>`;
  };
  draw();
  body.addEventListener('click', async e => {
    const m = e.target.closest('[data-m]'); if (m) { months = +m.dataset.m; draw(); return; }
    const b = e.target.closest('[data-sub]'); if (!b) return;
    const host = body.querySelector('.plan-pay');
    try {
      const r = await api('/api/plans/subscribe', { method: 'POST', body: { plan: b.dataset.sub, months } });
      host.innerHTML = `<p class="meta">Pay $${r.usd} USDC to Outcry for ${esc(r.plan.name)} (${months === 12 ? '1 year' : '1 month'}):</p>`;
      host.appendChild(withdrawTicket(r.withdrawal, { onDone: async (x) => {
        if (x.status !== 'confirmed') return;
        try { const a = await api('/api/plans/confirm', { method: 'POST', body: { withdrawalId: r.withdrawal.id } }); toast(`${r.plan.name} active until ${new Date(a.until).toLocaleDateString()}`); feed(`Upgraded to ${r.plan.name}`); close(); }
        catch (err) { toast(err.message); }
      } }));
      host.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) { host.innerHTML = `<p class="meta down">${esc(err.message)}</p>`; }
  });
}
$('marketBtn').onclick = () => openMarket();
$('plansBtn').onclick = () => openPlans();
$('adminBtn').onclick = () => openAdmin();
let tgState = null;
$('tgBtn').onclick = async () => {
  if (tgState?.linked) {
    if (!confirm('Turn off Telegram alerts?')) return;
    await api('/api/telegram', { method: 'DELETE' }).catch(() => {});
    toast('Telegram alerts off'); loadAccount(); return;

$('liveBtn').onclick = () => openLive();
$('handleBtn').onclick = () => chooseHandle();

async function openRecap(agentId) {
  let data;
  try { data = await api(`/api/agents/${agentId}/recap`); } catch (e) { return toast(e.message); }
  if (!window.OutcryRecap) return toast('Recap player is still loading, try again');
  const m = document.createElement('div'); m.className = 'recap-modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-label', 'Agent recap');
  m.innerHTML = `<canvas aria-label="Animated recap of ${esc(data.name)}"></canvas>
    <div class="recap-bar"><button class="btn btn-primary" data-r="play">▶ Replay</button><button class="btn" data-r="sound">🔊 Sound on</button><button class="btn" data-r="video">⬇ Download video</button><button class="btn" data-r="share">🔗 Copy share link</button><button class="btn" data-r="close">Close</button></div>`;
  document.body.appendChild(m);
  let sound = true;
  const r = OutcryRecap.mount(m.querySelector('canvas'), data, { sound });
  r.play();
  const close = () => { r.stop(); m.remove(); };
  m.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-r]'); if (!b) { if (e.target === m) close(); return; }
    const a = b.dataset.r;
    if (a === 'close') close();
    if (a === 'play') r.play();
    if (a === 'sound') { sound = !sound; r.setSound(sound); b.textContent = sound ? '🔊 Sound on' : '🔇 Sound off'; }
    if (a === 'video') {
      b.disabled = true; b.textContent = 'Recording… (15s)';
      try {
        const blob = await r.record();
        const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.download = `outcry-${data.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-recap.${ext}`; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 10_000);
      } catch (err) { toast('Video recording is not supported in this browser'); }
      b.disabled = false; b.textContent = '⬇ Download video';
    }
    if (a === 'share') {
      try {
        const s = await api(`/api/agents/${agentId}/recap`, { method: 'POST' });
        const url = location.origin + s.path;
        try { await navigator.clipboard.writeText(url); toast('Link copied: ' + url); } catch { prompt('Share this link', url); }
      } catch (err) { toast(err.message); }
    }
  });
  document.addEventListener('keydown', function onKey(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } });
}

let polling = false;
async function pollAgents() {
  if (polling || !token) return; polling = true;
  try {
    const list = await api('/api/agents');
    const act = list.filter(x => x.perf && x.perf.startUsd > 0 && x.agent.state !== 'killed');
    $('agentPerfSec').hidden = !act.length;
    if (act.length) {
      const tot = act.reduce((s, x) => s + x.perf.equityUsd, 0), start = act.reduce((s, x) => s + x.perf.startUsd, 0);
      const allPaper = act.every(x => x.perf.virtual);
      $('agentPerfNote').textContent = `${usd(tot)} ${allPaper ? 'paper money, separate from your wallet' : 'in agent wallets'} · ${sgn(tot - start)}${usd(Math.abs(tot - start)).replace('−', '')}`;
      $('agentPerf').innerHTML = act.map(({ agent: a, perf }) => `<div class="ap-row" data-id="${a.id}" title="Open live chart"><span class="ap-name">${esc(a.spec.name)} <span class="status st-${a.state}">${a.state.toUpperCase()}</span></span><span class="ap-val">${usd(perf.equityUsd)} <span class="${perf.pnlUsd >= 0 ? 'up' : 'down'}">${sgn(perf.pnlPct)}${Math.abs(perf.pnlPct).toFixed(1)}%</span></span>${sparkline(perf.history, perf.startUsd)}</div>`).join('');
    }
    for (const x of list) liveCharts.get(x.agent.id)?.(x.perf, x.agent);
  } catch { /* transient */ } finally { polling = false; }
}
setInterval(() => { if (!document.hidden) pollAgents(); }, 3000);
$('agentPerf').addEventListener('click', async e => {
  const row = e.target.closest('.ap-row'); if (!row) return;
  const id = row.dataset.id;
  const list = await api('/api/agents'); const x = list.find(y => y.agent.id === id); if (!x) return;
  const body = addAI(`<p><b>${esc(x.agent.spec.name)}</b>, live. Updates every few seconds.</p>`);
  const panel = perfPanel(id); body.appendChild(panel.el); panel.update(x.perf, x.agent); scrollDown();
});

function onEvent(e) {
  if (e.type === 'agent.activity') { feed(e.message); refresh(); }
  else if (e.type === 'agent.proposal' && !shown.has(e.ticketId)) {
    shown.add(e.ticketId);
    api('/api/tickets/' + e.ticketId).then(t => {
      if (t.source?.type !== 'agent' || t.kind !== 'order') return;
      const body = addAI('<p>Your agent proposes a trade. It waits for your tap.</p>');
      body.appendChild(orderCard(t));
    }).catch(() => {});
  }
  else if (e.type === 'fill') { if (!e.agentId) feed(e.summary); else pollAgents(); }
  else if (e.type === 'agent.state' || e.type === 'balances') refresh();
}
function connectEvents() {
  if (mode === 'local') { window.OutcryLocal.subscribe(token, onEvent); return; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/events?token=${encodeURIComponent(token)}`);
  ws.onmessage = (m) => onEvent(JSON.parse(m.data));
  ws.onclose = () => setTimeout(connectEvents, 2000);
}

(async function boot() {
  await detectMode();
  if (mode === 'none') { addAI('<p>No backend found. Run <span class="mono">npm start</span> or build <span class="mono">outcry-local.js</span>.</p>'); return; }
  $('modePill').textContent = mode === 'local' ? 'DEMO · RUNS IN YOUR BROWSER · PAPER MODE' : 'PAPER MODE · NO REAL TRANSACTIONS';
  try {
    let s = null;
    const saved = mode === 'server' ? store.get(TOKEN_KEY) : null;
    if (saved) {
      token = saved;
      try { const me = await api('/api/me'); s = { token, user: me.user, llm: me.llm, market: me.market }; } catch { token = null; store.set(TOKEN_KEY, null); }
    }
    const ref = new URLSearchParams(location.search).get('ref');
    if (!s) { s = await api('/api/session', { method: 'POST', body: { badge: 'LOUD', jacket: 'memes', residence: 'CH', ...(ref ? { ref } : {}) } }); token = s.token; if (mode === 'server') store.set(TOKEN_KEY, token); }
    $('badge').textContent = s.user.badge;
    loadAccount();
    $('memberSub').textContent = 'Memes jacket · paper wallet';
    $('tiers').innerHTML = '<span class="eyebrow">Model tiers</span>' + s.llm.map(t => `<span><b>${t.tier}</b> ${esc(t.model)}</span>`).join('');
    if (mode === 'server') $('modePill').textContent = (s.market === 'real' ? 'PAPER MONEY · REAL MARKET' : 'PAPER MODE · SIMULATED MARKET') + (s.llm.some(t => t.live) ? ' · LIVE AI' : '');
    if (mode === 'server') {
      // Reopen the last chat: from this browser, or the account's most recent one (new device).
      let c = store.get(CHAT_KEY);
      if (!c) { try { c = (await api('/api/chat'))[0]?.sessionId; } catch {} }
      if (c) sessionId = c;
      store.set(CHAT_KEY, sessionId);
    }
    if (!(await loadHistory())) welcome();
    loadChats(); refresh(); connectEvents();
    // Deep links from shared pages: #creator=handle or #market
    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get('creator')) openCreator(hash.get('creator'));
    else if (location.hash === '#market') openMarket();
  } catch (e) { addAI(`<p>Could not start a session: ${esc(e.message)}</p>`); }
})();
