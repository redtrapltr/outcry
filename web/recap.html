<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent recap · Outcry</title>
<meta name="description" content="An AI trading agent's run, replayed. Built on Outcry by Woodeng.">
<meta property="og:title" content="Agent recap · Outcry">
<meta property="og:description" content="Watch what this AI trading agent did, trade by trade.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#0E1030;--text:#F3EFE4;--muted:#9EA2C9;--voice:#2F3CFF;--line2:#3A407A}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.5 'Geist',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
canvas{max-height:calc(100dvh - 140px);max-width:100%;aspect-ratio:4/5;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);cursor:pointer}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line2);background:transparent;color:inherit;border-radius:999px;padding:10px 18px;font:inherit;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--voice);border-color:var(--voice);font-weight:600}
.err{color:var(--muted);font-family:'JetBrains Mono',monospace;text-align:center;max-width:460px}
</style>
<script src="recap.js" defer></script>
</head>
<body>
<canvas id="c" aria-label="Animated agent recap"></canvas>
<div class="bar">
  <button class="btn primary" id="play" type="button">▶ Play with sound</button>
  <a class="btn" href="terminal.html">Build your own agent on Outcry →</a>
</div>
<script>
window.addEventListener('DOMContentLoaded', async () => {
  const id = new URLSearchParams(location.search).get('id');
  const c = document.getElementById('c');
  try {
    const r = await fetch('/api/recap/' + encodeURIComponent(id || ''));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Recap not found');
    document.title = `${data.name} recap · Outcry`;
    const rec = OutcryRecap.mount(c, data, { sound: true });
    const play = () => rec.play();
    document.getElementById('play').onclick = play;
    c.onclick = play;
  } catch (e) {
    c.remove();
    document.querySelector('.bar').insertAdjacentHTML('beforebegin', `<p class="err">${String(e.message).replace(/</g, '&lt;')}</p>`);
  }
});
</script>
</body>
</html>
